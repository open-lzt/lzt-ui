name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm trusted publishing exchanges for
      # publish rights — without it npm falls back to asking for a 2FA code.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1+; the one bundled with node 20 is older.
      - run: npm install -g npm@latest

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

      - name: assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run build

      - name: assert build output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f lzt-ui.css

      - run: npm publish --access public
