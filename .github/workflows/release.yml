name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.2)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm trusted publishing exchanges for
      # publish rights — without it npm falls back to asking for a 2FA code.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1+; the one bundled with node 22 is older.
      - run: npm install -g npm@latest

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

      # The GitHub release tag is the single source of truth for the version;
      # package.json in the repo is left alone and only patched here, in CI.
      - name: set version from the release tag
        run: |
          version="${{ github.event.inputs.version || github.event.release.tag_name }}"
          version="${version#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag '$version' is not a semver version" >&2; exit 1 ;;
          esac
          npm version "$version" --no-git-tag-version --allow-same-version

      - run: npm run build

      - name: assert build output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f lzt-ui.css

      - run: npm publish --access public
